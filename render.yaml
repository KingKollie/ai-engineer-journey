services:
  - type: web
    name: kollie-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn day16:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: kollie-ai-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run day17.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        sync: false
